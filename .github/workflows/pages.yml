name: Deployer

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Build image
        run: docker build -t mimiqex .
      - name: Instantiate image
        run: docker create --name mimiqex mimiqex
      - name: Extract artifact
        run: docker cp mimiqex:/usr/local/apache2/htdocs/ ./dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/
  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read 
      pages: write
    steps:
      - name: Push to GitHub pages
        uses: actions/deploy-pages@v4